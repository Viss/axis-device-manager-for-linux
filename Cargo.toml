[package]
name = "axis-device-manager-for-linux"
version = "0.1.30"
edition = "2021"
license = "MIT"
description = "Linux desktop manager for Axis network devices"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = "0.31"
md5 = "0.7"
sha2 = "0.10"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls-native-roots"] }
rfd = "0.15"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
